<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="game-container">
        <div id="game-board"></div>

        <div class="controls">

            <button data-direction="UP">⬆️</button>

            <div>
                <button data-direction="LEFT">⬅️</button>
                <button data-direction="DOWN">⬇️</button>
                <button data-direction="RIGHT">➡️</button>
            </div>

        </div>
    </div>
    <!-- type="module" means this script is an ES6 module, which allows import/export
         between separate files (main.js -> game.js -> snake.js). -->
    <script type="module" src="./js/main.js"></script>
</body>

</html>
